spring:
  application:
    name: BloomSchool

  datasource:
    url: jdbc:postgresql://localhost:5432/bloom_school_db
    username: user1
    password: user1
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        
server:
  port: 8081