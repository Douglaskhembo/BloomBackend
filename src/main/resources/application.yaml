spring:
  application:
    name: BloomSchool

  # Defaults are for local development; override with env vars on the hosted server.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bloom_school_db_2}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:9090}
  # Respect X-Forwarded-* headers so Swagger "Try it out" uses https on the hosted URL
  forward-headers-strategy: framework

app:
  cors:
    # Comma-separated list of frontend origins allowed to call the API
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.bloom.bloomschool

management:
  endpoints:
    web:
      exposure:
        include: health,info
