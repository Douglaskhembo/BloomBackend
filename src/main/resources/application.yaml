spring:
  application:
    name: BloomSchool

#  datasource:
#    url: jdbc:postgresql://localhost:5432/bloom_school_db
#    username: user1
#    password: user1
#    driver-class-name: org.postgresql.Driver

#For Pull requests use this
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bloom_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Mniowwb@2025}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:9090}
  # Respect X-Forwarded-* headers so Swagger "Try it out" uses https on the hosted URL
  forward-headers-strategy: framework

app:
  cors:
    # Comma-separated list of frontend origins allowed to call the API
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://localhost:5173}
  uploads:
    document-folder: uploads/documents

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.bloom.bloomschool

management:
  endpoints:
    web:
      exposure:
        include: health,info

  datasource:
    url: jdbc:postgresql://localhost:5432/bloom_school_db
    username: user1
    password: user1
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
