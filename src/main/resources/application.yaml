spring:
  application:
    name: BloomSchool

  datasource:
    url: jdbc:postgresql://localhost:5432/bloom_school_db
    username: admin
    password: pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        
server:
  port: 9090