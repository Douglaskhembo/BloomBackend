name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [development]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bloom_test
          POSTGRES_USER: bloom
          POSTGRES_PASSWORD: bloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloom -d bloom_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/bloom_test
      DB_USERNAME: bloom
      DB_PASSWORD: bloom

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: chmod +x mvnw && ./mvnw -B verify
